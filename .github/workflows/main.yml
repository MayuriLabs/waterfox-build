name: Build Waterfox

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: true
        default: 'current'
      DISPLAY_VERSION:
        description: 'Display Version (e.g. 6.6.14)'
        required: false
        type: string
        default: '6.6.14'

permissions:
  contents: write

jobs:
  build-x86_64:
    uses: ./.github/workflows/fedora-x86_64.yml
    with:
      branch: ${{ github.event.inputs.branch || inputs.branch || 'current' }}
      DISPLAY_VERSION: ${{ github.event.inputs.DISPLAY_VERSION || inputs.DISPLAY_VERSION }}

  build-aarch64:
    uses: ./.github/workflows/fedora-aarch64.yml
    with:
      branch: ${{ github.event.inputs.branch || inputs.branch || 'current' }}
      DISPLAY_VERSION: ${{ github.event.inputs.DISPLAY_VERSION || inputs.DISPLAY_VERSION }}

  release:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: Waterfox RPM Build ${{ github.run_id }}
          files: artifacts/*.rpm
          draft: false
          prerelease: true
